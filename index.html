            <div>
                <label for="name">Name on Card</label><br>
                <input id="name" placeholder="Name Surname" required>
            </div>
            <div>
                <label for="card-number">Card Number</label><br>
                <input id="card-number" type="tel" inputmode="numeric" pattern="[0-9\s]{13,19}" 
                autocomplete="cc-number" maxlength="19" placeholder="1111 2222 3333 4444" required>
            </div>
            
            <div class="expir">
            <div>
                <label for="date">Expiration Date</label>
                    <input type="text" name="month" placeholder="MM/YY" maxlength="5" size="5"  required>
    
            </div>
            <div>
                <label for="cvv">CVV</label><br>
                <input id="cvv" type="tel" name="cvv" inputmode="numeric" pattern="[0-9\s]{1,3}" 
                autocomplete="cc-number" maxlength="3" placeholder="123" required>
            </div>
        </div>

            <div class="price-right">

            <div class="price-right">

            </div>
